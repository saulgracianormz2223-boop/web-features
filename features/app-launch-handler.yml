name: Launch handler saul ramirez
description: The `launch_handler` web app manifest member, with the `client_mode` property, configure how web app launches behave when an instance on the app is already open. For example, you can open to focus the app instance instead of launching a new one.
spec: https://wicg.github.io/web-app-launch/
group: progressive-web-app
compat_features:
  - api.LaunchParams
  - api.LaunchParams.targetURL
  - api.LaunchQueue
  - api.LaunchQueue.setConsumer
  - api.Window.launchQueue
  
